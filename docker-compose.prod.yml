version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    depends_on:
      - profile-service
      - job-service
    networks:
      - kodnest-network

  profile-service:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        SERVICE_NAME: profile-service
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - PORT=8002
    volumes:
      - profile-data:/app/backend/profile-service/prisma
    networks:
      - kodnest-network

  job-service:
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        SERVICE_NAME: job-service
    ports:
      - "8003:8003"
    environment:
      - NODE_ENV=production
      - PORT=8003
    volumes:
      - job-data:/app/backend/job-service/prisma
    networks:
      - kodnest-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api-gateway:8000
    depends_on:
      - api-gateway
    networks:
      - kodnest-network

networks:
  kodnest-network:
    driver: bridge

volumes:
  profile-data:
  job-data:
